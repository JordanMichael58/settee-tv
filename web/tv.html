<!doctype html>
<html lang="en" data-look="evening" data-accent="marigold">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settee TV</title>
<link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/tv.css">
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></symbol>
  <symbol id="i-channels" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></symbol>
  <symbol id="i-news" viewBox="0 0 24 24"><path d="M4 5.5h12.5V19a1.5 1.5 0 0 0 1.5 1.5H6A2 2 0 0 1 4 18.5Z"/><path d="M16.5 9H20v10a1.5 1.5 0 0 1-3 0"/><path d="M7.5 9h5.5M7.5 12.5h5.5M7.5 16h3.5"/></symbol>
  <symbol id="i-weather" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M9 2.5v1M3 8.5h1M4.8 4.3l.7.7M13.2 4.3l-.7.7"/><path d="M8 20.5h9a3.5 3.5 0 0 0 .4-7 5 5 0 0 0-9.6 1.2A2.9 2.9 0 0 0 8 20.5Z"/></symbol>
  <symbol id="i-photos" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="9.5" r="1.7"/><path d="m4 17 5-4.5 4 3.5 2.5-2 4.5 3.5"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></symbol>
  <symbol id="w-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4"/></symbol>
  <symbol id="w-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10Z"/></symbol>
  <symbol id="w-partly" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M9 2.5v1M3 8.5h1M4.8 4.3l.7.7M13.2 4.3l-.7.7"/><path d="M8 20.5h9a3.5 3.5 0 0 0 .4-7 5 5 0 0 0-9.6 1.2A2.9 2.9 0 0 0 8 20.5Z"/></symbol>
  <symbol id="w-cloud" viewBox="0 0 24 24"><path d="M7 19h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.6A3.3 3.3 0 0 0 7 19Z"/></symbol>
  <symbol id="w-fog" viewBox="0 0 24 24"><path d="M7 13.5h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.6"/><path d="M4 17h16M6 20.5h12"/></symbol>
  <symbol id="w-rain" viewBox="0 0 24 24"><path d="M7 15h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.6A3.3 3.3 0 0 0 7 15Z"/><path d="m8.5 18-1 2.5M12.5 18l-1 2.5M16.5 18l-1 2.5"/></symbol>
  <symbol id="w-snow" viewBox="0 0 24 24"><path d="M7 15h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.6A3.3 3.3 0 0 0 7 15Z"/><path d="M8.5 19h.01M12 20.5h.01M15.5 19h.01"/></symbol>
  <symbol id="w-storm" viewBox="0 0 24 24"><path d="M7 15h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.6A3.3 3.3 0 0 0 7 15Z"/><path d="m12.5 15-2 3.5h3l-2 3.5"/></symbol>
</svg>

<div class="room">
  <nav class="rail" aria-label="Menu">
    <div class="mark"><span class="mark-seat"></span><span data-t="brand">Settee</span></div>
    <ul class="menu" id="menu">
      <li><button class="go" data-view="home"><svg><use href="#i-home"/></svg><span data-t="home">Home</span></button></li>
      <li><button class="go" data-view="channels"><svg><use href="#i-channels"/></svg><span data-t="channels">Channels</span></button></li>
      <li><button class="go" data-view="news"><svg><use href="#i-news"/></svg><span data-t="news">News</span></button></li>
      <li><button class="go" data-view="weather"><svg><use href="#i-weather"/></svg><span data-t="weather">Weather</span></button></li>
      <li><button class="go" data-view="photos"><svg><use href="#i-photos"/></svg><span data-t="photos">Photos</span></button></li>
      <li><button class="go" data-view="phone"><svg><use href="#i-phone"/></svg><span data-t="phone">Phone remote</span></button></li>
    </ul>
    <p class="rail-time" id="rail-time"></p>
  </nav>

  <main class="stage">
    <section class="view home" id="view-home" aria-labelledby="home-title">
      <h1 class="sr" id="home-title" data-t="home">Home</h1>
      <article class="card clock" tabindex="-1">
        <p class="clock-time" id="clock"><span class="hh">--</span><span class="colon">:</span><span class="mm">--</span></p>
        <p class="clock-date" id="date"></p>
        <p class="clock-greet" id="greet"></p>
      </article>
      <button class="card photo focusable" id="home-photo" data-go="photos">
        <span class="photo-layer" id="photo-a"></span><span class="photo-layer" id="photo-b"></span>
        <span class="photo-empty" id="photo-empty" data-t="noPhotos">Your photos show here</span>
      </button>
      <button class="card weather-now focusable" data-go="weather">
        <svg class="wx-big" id="wx-icon"><use href="#w-partly"/></svg>
        <span class="wx-temp" id="wx-temp">--°</span>
        <span class="wx-line"><span id="wx-text"></span><span class="wx-place" id="wx-place"></span></span>
        <span class="wx-range" id="wx-range"></span>
      </button>
      <button class="card headline focusable" data-go="news">
        <span class="headline-label" data-t="topStory">Top story</span>
        <span class="headline-title" id="headline">…</span>
        <span class="headline-when" id="headline-when"></span>
      </button>
      <div class="strip" id="strip" role="list" aria-label="Channels"></div>
    </section>

    <section class="view channels" id="view-channels" hidden aria-labelledby="ch-title">
      <header class="view-head"><h1 id="ch-title" data-t="channels">Channels</h1><p data-t="channelsHint">Press a number on the remote to open a channel.</p></header>
      <div class="grid" id="grid" role="list"></div>
    </section>

    <section class="view news" id="view-news" hidden aria-labelledby="news-title">
      <header class="view-head"><h1 id="news-title" data-t="news">News</h1><p id="news-source"></p></header>
      <ol class="stories" id="stories"></ol>
    </section>

    <section class="view weather" id="view-weather" hidden aria-labelledby="wx-title">
      <header class="view-head"><h1 id="wx-title"><span data-t="weather">Weather</span> <span class="soft" id="wx-title-place"></span></h1><p id="wx-now-line"></p></header>
      <ol class="days" id="days"></ol>
    </section>

    <section class="view photos" id="view-photos" hidden aria-label="Photos">
      <div class="slide" id="slide"><span class="photo-layer" id="slide-a"></span><span class="photo-layer" id="slide-b"></span></div>
      <p class="slide-empty" id="slide-empty"></p>
      <p class="slide-count" id="slide-count"></p>
    </section>

    <section class="view phone" id="view-phone" hidden aria-labelledby="ph-title">
      <div class="pair">
        <div class="qr" id="qr" aria-label="QR code for the phone remote"></div>
        <div class="pair-text">
          <h1 id="ph-title" data-t="phoneTitle">Use your phone as the remote</h1>
          <ol class="pair-steps">
            <li data-t="step1">Join the same Wi-Fi as this TV.</li>
            <li data-t="step2">Scan the code with the phone's camera.</li>
            <li><span data-t="step3">Or open</span> <b id="pair-url"></b> <span data-t="step3b">and type</span> <b class="code" id="pair-code"></b></li>
          </ol>
          <p class="soft" id="pair-phones"></p>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="osd" id="osd" hidden aria-live="assertive">
  <span class="osd-num" id="osd-num"></span>
  <span class="osd-name" id="osd-name"></span>
  <span class="osd-bar"><span id="osd-fill"></span></span>
</div>
<p class="toast" id="toast" role="status" hidden></p>

<script src="/static/qrcode.js"></script>
<script src="/static/tv.js"></script>
</body>
</html>
